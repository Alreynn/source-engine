name: Android APK (arm64)

# Build engine arm64 + bungkus jadi APK dengan launcher nillerusr/srceng-android.
# Hasil: artifact "srceng-<varian>-apk" berisi file .apk

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        type: choice
        options: [release, debug]
        default: release

jobs:
  apk:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64-r20b-clang
            ndk: r20b
            args: "--android=aarch64,clang,21"
          - name: arm64-r10e-host
            ndk: r10e
            host_clang: true
            args: "--android=aarch64,host,21"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Android NDK ${{ matrix.ndk }}
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-${{ matrix.ndk }}-linux-x86_64.zip
          unzip -q android-ndk-${{ matrix.ndk }}-linux-x86_64.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-${{ matrix.ndk }}" >> "$GITHUB_ENV"
          echo "NDK_HOME=$PWD/android-ndk-${{ matrix.ndk }}" >> "$GITHUB_ENV"

      - name: Copy gnustl from NDK r10e into r20b
        if: matrix.ndk == 'r20b'
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
          unzip -q android-ndk-r10e-linux-x86_64.zip 'android-ndk-r10e/sources/cxx-stl/gnu-libstdc++/*' -d r10e-src
          mkdir -p android-ndk-r20b/sources/cxx-stl
          cp -r r10e-src/android-ndk-r10e/sources/cxx-stl/gnu-libstdc++ android-ndk-r20b/sources/cxx-stl/

      - name: Install clang 11
        if: matrix.host_clang
        run: |
          sudo apt-get install -y libtinfo5 || true
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-11.1.0/clang+llvm-11.1.0-x86_64-linux-gnu-ubuntu-16.04.tar.xz
          mkdir clang11
          tar -xf clang+llvm-11.1.0-x86_64-linux-gnu-ubuntu-16.04.tar.xz -C clang11 --strip-components=1
          echo "$PWD/clang11/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          ./waf configure -T ${{ inputs.build_mode || 'release' }} --togles ${{ matrix.args }} --disable-warns || {
            echo "=== config.log (bagian akhir) ==="
            tail -n 80 build/config.log
            exit 1
          }

      - name: Build and install engine libraries
        run: |
          ./waf build
          ./waf install --strip --destdir="$PWD/apkroot"

      - name: Collect libraries for APK
        run: |
          mkdir -p apklibs/lib/arm64-v8a
          find apkroot -type f -name '*.so' -exec cp -v {} apklibs/lib/arm64-v8a/ \;
          ls -la apklibs/lib/arm64-v8a
          test -f apklibs/lib/arm64-v8a/libSDL2.so   || { echo "libSDL2.so tidak ada"; exit 1; }
          test -f apklibs/lib/arm64-v8a/liblauncher.so || { echo "liblauncher.so tidak ada"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Get launcher (srceng-android)
        run: git clone --depth 1 --branch android-fixes https://github.com/nillerusr/srceng-android.git launcher

      - name: Build APK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$SDK/build-tools/$(ls "$SDK/build-tools" | sort -V | tail -n1)"
          AJAR="$(ls -d "$SDK"/platforms/android-* | grep -E 'android-[0-9]+$' | sort -V | tail -n1)/android.jar"
          echo "build-tools: $BT"
          echo "android.jar: $AJAR"

          LIBS="$PWD/apklibs/lib"
          cd launcher
          mkdir -p build/gen build/classes build/dex

          # 1. resource + manifest + assets
          "$BT/aapt2" compile --dir res -o build/res.zip
          "$BT/aapt2" link -o build/base.apk -I "$AJAR" \
            --manifest AndroidManifest.xml -A assets \
            --java build/gen --min-sdk-version 21 --target-sdk-version 24 \
            --auto-add-overlay build/res.zip

          # 2. compile Java -> dex
          javac --release 8 -nowarn -cp "$AJAR" -d build/classes \
            $(find src build/gen -name '*.java')
          "$BT/d8" --release --min-api 21 --lib "$AJAR" --output build/dex \
            $(find build/classes -name '*.class')

          # 3. gabungkan dex + library native
          cp build/base.apk build/app-unsigned.apk
          (cd build/dex && zip -q ../app-unsigned.apk classes.dex)
          (cd "$LIBS/.." && zip -q -r "$OLDPWD/build/app-unsigned.apk" lib)

          # 4. align + sign (pakai debug.keystore bawaan repo launcher)
          "$BT/zipalign" -f -p 4 build/app-unsigned.apk build/app-aligned.apk
          "$BT/apksigner" sign --ks debug.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out ../srceng-${{ matrix.name }}.apk build/app-aligned.apk
          "$BT/apksigner" verify --verbose ../srceng-${{ matrix.name }}.apk || true
          ls -la ../srceng-${{ matrix.name }}.apk
          unzip -l ../srceng-${{ matrix.name }}.apk | grep -E "classes.dex|lib/arm64" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: srceng-${{ matrix.name }}-apk
          path: srceng-${{ matrix.name }}.apk
          if-no-files-found: error

      - name: Upload config.log (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-log-${{ matrix.name }}
          path: build/config.log
          if-no-files-found: ignore
