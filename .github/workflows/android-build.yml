name: Android build

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        type: choice
        options: [release, debug]
        default: release

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false   # kalau satu arsitektur gagal, yang lain tetap lanjut
      matrix:
        include:
          - name: arm64
            args: "--android=aarch64,4.9,21"
          - name: armv7
            args: "--android=armeabi-v7a-hard,4.9,21"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Android NDK r10e
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
          unzip -q android-ndk-r10e-linux-x86_64.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r10e" >> "$GITHUB_ENV"
          echo "NDK_HOME=$PWD/android-ndk-r10e" >> "$GITHUB_ENV"

      - name: Configure
        run: ./waf configure -T ${{ inputs.build_mode || 'release' }} --togles ${{ matrix.args }} --disable-warns

      - name: Build
        run: ./waf build

      - name: List results
        run: find build -name '*.so' | sort

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: srceng-${{ matrix.name }}
          path: build/**/*.so
          if-no-files-found: error
